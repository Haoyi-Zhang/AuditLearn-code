name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Portable selector membership regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-output
          ulimit -v 3670016
          ulimit -t 120
          timeout --signal=TERM --kill-after=10s 120s \
            python -B tests/check_selector_membership.py \
            > raw-output/selector-membership.log 2>&1
          timeout --signal=TERM --kill-after=10s 120s \
            python -B -O tests/check_selector_membership.py \
            > raw-output/selector-membership-optimized.log 2>&1
      - name: Exact checks, all three synthetic campaigns, and reconciliation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-output
          ulimit -v 3670016
          ulimit -t 900
          timeout --signal=TERM --kill-after=10s 900s \
            python -B reproduce_release.py raw-output \
            > raw-output/workflow.log 2>&1
      - name: Retain raw results and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auditlearn-scientific-output
          path: raw-output/
          if-no-files-found: warn
          retention-days: 7
